<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WCTM{% endblock %} - World Cup Ticket Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <a href="{{ url_for('dashboard') }}" class="navbar-brand">
            ⚽ <span>WCTM</span> World Cup 2026
        </a>
        <ul class="navbar-nav">
            <li><a href="{{ url_for('dashboard') }}" class="{{ 'active' if active_page == 'dashboard' }}">Dashboard</a></li>
            <li><a href="{{ url_for('matches_page') }}" class="{{ 'active' if active_page == 'matches' }}">Matches</a></li>
            <li><a href="{{ url_for('watched_page') }}" class="{{ 'active' if active_page == 'watched' }}">Watched</a></li>
            <li><a href="{{ url_for('settings_page') }}" class="{{ 'active' if active_page == 'settings' }}">Settings</a></li>
        </ul>
    </nav>

    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
