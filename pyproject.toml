[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "worldcup-ticket-monitor"
version = "1.0.0"
description = "Monitor FIFA World Cup 2026 ticket availability and get notified instantly"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "playwright>=1.40",
    "pyyaml>=6.0",
    "plyer>=2.1",
    "schedule>=1.2",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23"]

[project.scripts]
wctm = "wctm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
